name: Build and Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Dependency Cache
        uses: swatinem/rust-cache@v2

      - name: Read Version from Cargo.toml
        id: pkg_version
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          if ($content -match '(?m)^version\s*=\s*"([^"]+)"') {
              $ver = $matches[1]
              Write-Output "VERSION=$ver" >> $env:GITHUB_OUTPUT
              Write-Host "Detected DisplayWarp version: $ver"
          } else {
              Write-Error "Could not read version from Cargo.toml"
              exit 1
          }

      - name: Compile Release Binary
        run: cargo build --release

      - name: Package Distribution Zip
        id: package
        shell: pwsh
        run: |
          $ver = "${{ steps.pkg_version.outputs.VERSION }}"
          $zipName = "DisplayWarp-v$ver-windows-x86_64.zip"
          Compress-Archive -Path "target\release\DisplayWarp.exe", "README.md", "LICENSE" -DestinationPath $zipName
          Write-Output "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
          Write-Host "Created distribution package: $zipName"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.pkg_version.outputs.VERSION }}"
          name: "DisplayWarp v${{ steps.pkg_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/DisplayWarp.exe
            ${{ steps.package.outputs.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
